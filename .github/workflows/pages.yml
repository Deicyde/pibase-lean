name: Deploy project site to Pages

on:
  push:
    branches: [master, add-counterexample-spaces]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # build_review.py reads git history for per-file authorship
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dashboard dependencies
        run: npm ci
      - name: Check dashboard types
        run: npm run dashboard:check
      - name: Build the project dashboard
        run: npm run dashboard:build
      - name: Verify dashboard artifacts
        run: npm run dashboard:verify
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
