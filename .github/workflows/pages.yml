name: Deploy project site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Dashboard review metadata derives authorship from repository history.
          fetch-depth: 0

      - name: Check out Felix's pi-base data
        run: git clone --depth 1 --branch main https://github.com/felixpernegger/pibase-data.git "$RUNNER_TEMP/felix-pibase-data"

      - name: Set up Lean, restore caches, and build the space audit
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: --wfail spaceAudit
          test: false
          lint: false
          use-mathlib-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the implications payload
        # Felix's deduction engine (build_site.py) produces the payload replayed
        # by the Implications page, so assertions accepted upstream are current
        # at every deploy.
        run: |
          pip install pyyaml
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/fetch_implications.py "$RUNNER_TEMP/felix-pibase-data"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dashboard dependencies
        run: npm ci

      - name: Check generated Lean inputs
        run: npm run generated:check

      - name: Run the Lean-native space audit
        id: space-audit
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/space-audit"
          set +e
          npm run --silent audit:run > "${RUNNER_TEMP}/space-audit/space-audit.json" 2> "${RUNNER_TEMP}/space-audit/space-audit.stderr.log"
          audit_status=$?
          set -e
          cat "${RUNNER_TEMP}/space-audit/space-audit.stderr.log" >&2
          exit "${audit_status}"

      - name: Upload space audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pages-space-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/space-audit
          if-no-files-found: warn

      - name: Run Python tests
        run: npm run test:python

      - name: Check dashboard types
        run: npm run dashboard:check

      - name: Build the project dashboard
        env:
          PIBASE_SPACE_AUDIT_ARTIFACT: ${{ runner.temp }}/space-audit/space-audit.json
        run: npm run dashboard:build

      - name: Verify dashboard artifacts
        run: npm run dashboard:verify

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
